<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Vô Tri - Creative Handmade & Printing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e6f2ee;
        }
        /* Phong cách Kính mờ siêu thực - Ultra Liquid Glass */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-modal {
            background: rgba(230, 242, 238, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(45, 90, 75, 0.25);
        }
        /* Custom thanh cuộn xinh xắn */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(45, 90, 75, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(45, 90, 75, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center justify-start">

    <!-- KHUNG TRANG CHỦ MOCKUP CHÍNH -->
    <div class="w-full max-w-6xl glass-panel rounded-3xl p-6 shadow-xl relative overflow-hidden mb-8">
        <!-- Header Shop -->
        <div class="flex flex-col md:flex-row items-center justify-between border-b border-emerald-100 pb-6 mb-6 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-emerald-700/10 flex items-center justify-center font-bold text-emerald-800 text-center text-xs p-2 border border-emerald-200">
                    ẢNH LOGO
                </div>
                <div>
                    <h1 class="text-xl font-bold text-emerald-950 flex items-center gap-2">
                        🌸 CỬA HÀNG VÔ TRI 🌸
                    </h1>
                    <p class="text-xs text-emerald-700 font-medium">CREATIVE HANDMADE & PRINTING</p>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="px-4 py-1.5 bg-emerald-800 text-white font-semibold rounded-full text-xs shadow-sm">IN 3D</span>
                <span class="px-4 py-1.5 bg-white/80 text-emerald-900 font-medium rounded-full text-xs border border-emerald-200/60 shadow-sm flex items-center gap-1">
                    MỚI NHẤT <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </span>
            </div>
        </div>

        <!-- Khung Demo sản phẩm đại diện ngoài danh sách -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="product-list">
            <!-- Code JS sẽ tự đổ sản phẩm demo vào đây -->
        </div>
    </div>

    <!-- P0PUP CHI TIẾT SẢN PHẨM (MOCKUP SPRINT 2) -->
    <div id="detail-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm hidden transition-all duration-300">
        <div class="w-full max-w-4xl glass-modal rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-[90vh] md:max-h-[85vh] relative animate-fade-in">
            
            <!-- Nút đóng Close (X) -->
            <button onclick="closePopup()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/60 hover:bg-white text-emerald-950 flex items-center justify-center transition-all border border-emerald-200/40 z-10 cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Cột trái: Thư viện Slide Ảnh -->
            <div class="w-full md:w-1/2 p-6 flex flex-col justify-between bg-white/20 border-b md:border-b-0 md:border-r border-emerald-100">
                <div class="relative flex-1 flex items-center justify-center min-h-[260px] md:min-h-[340px]">
                    <span id="popup-tag" class="absolute top-0 left-0 px-3 py-1 bg-white/80 border border-emerald-200 text-emerald-900 font-medium text-xs rounded-full shadow-sm">
                        Đặt trước
                    </span>
                    <img id="popup-main-img" src="" alt="Sản phẩm" class="max-w-full max-h-[320px] object-contain rounded-2xl shadow-md border border-white/60">
                    
                    <!-- Nút chuyển slide ảnh nếu có nhiều ảnh -->
                    <button id="btn-next-img" class="absolute right-2 w-8 h-8 rounded-full bg-emerald-900/10 hover:bg-emerald-900/20 text-emerald-900 flex items-center justify-center transition-all cursor-pointer">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <!-- Chấm nhỏ hiển thị số lượng ảnh phụ -->
                <div id="popup-img-dots" class="flex justify-center gap-1.5 mt-3"></div>
            </div>

            <!-- Cột phải: Thông tin chi tiết & Check Giá động -->
            <div class="w-full md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto">
                <div>
                    <!-- Tên sản phẩm -->
                    <h2 id="popup-title" class="text-xl font-bold text-emerald-950 mb-2 pr-6">TÊN SẢN PHẨM 4</h2>
                    
                    <!-- Khung mô tả sản phẩm -->
                    <div class="mb-4">
                        <span class="text-[11px] font-bold tracking-wider text-emerald-800/60 uppercase block mb-1">MÔ TẢ</span>
                        <div id="popup-desc" class="text-sm text-emerald-900/80 bg-white/40 border border-white/40 rounded-xl p-3 max-h-[80px] overflow-y-auto leading-relaxed">
                            Content mô tả sản phẩm 4
                        </div>
                    </div>

                    <!-- Khung hiển thị giá -->
                    <div class="mb-5 flex items-baseline gap-2 bg-emerald-900/5 p-3 rounded-xl border border-emerald-950/5">
                        <span class="text-xs font-semibold text-emerald-800">GIÁ HIỂN THỊ:</span>
                        <span id="popup-price" class="text-2xl font-black text-emerald-900">0đ</span>
                    </div>

                    <!-- KHUNG CHECK GIÁ ĐỘNG (Sinh tự động từ Tab phụ) -->
                    <div id="check-gia-section" class="mb-6 bg-white/50 border border-emerald-100 rounded-2xl p-4 shadow-inner hidden">
                        <h3 class="text-xs font-bold text-emerald-900 tracking-wider uppercase border-b border-emerald-100/60 pb-1.5 mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-calculator text-emerald-700"></i> CHECK GIÁ TÙY CHỌN
                        </h3>
                        <div id="dynamic-options-space" class="space-y-4 max-h-[220px] overflow-y-auto pr-1">
                            <!-- Nút Radio Phân loại sẽ tự sinh ra ở đây -->
                        </div>
                    </div>
                </div>

                <!-- BỘ BA NÚT HÀNH ĐỘNG HẠNG NẶNG -->
                <div class="flex flex-col gap-2 mt-4 pt-4 border-t border-emerald-100/60">
                    <a id="btn-action-buy" href="#" target="_blank" class="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl text-center text-sm tracking-wide shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-bag-shopping"></i> MUA NHÉ
                    </a>
                    
                    <div class="grid grid-cols-2 gap-2" id="sub-action-group">
                        <button onclick="alert('Tính năng điền form thông tin yêu cầu thiết kế sẽ được cập nhật ở Sprint sau nha PO!')" class="py-2.5 bg-white/80 hover:bg-white text-emerald-900 font-bold border border-emerald-200 rounded-xl text-xs transition-all tracking-wide flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-file-pen text-emerald-700"></i> XIN TÍ INFO
                        </button>
                        <a id="btn-action-zalo" href="#" target="_blank" class="py-2.5 bg-white/80 hover:bg-white text-emerald-900 font-bold border border-emerald-200 rounded-xl text-xs transition-all tracking-wide flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-brands fa-square-zalo text-blue-500 text-sm"></i> TƯ VẤN ZALO NHÉ
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MÃ NGUỒN XỬ LÝ DỮ LIỆU ĐA TAB SHEET & MAPPING GIÁ -->
    <script>
        // Giả lập Dữ liệu từ Google Sheets thật của PO gửi qua ảnh chụp
        const shopConfig = {
            Link_Zalo: "http://zaloapp.com/qr/p/14jxxuqxy1zbj" // Đường link QR Zalo chính thức PO cung cấp
        };

        const sheetDanhSachSanPham = [
            { Ma_SP: "LEN-001", Ten_SP: "Móc khóa len vô tri", Danh_Muc: "Đồ len", Anh_Dai_Dien: "https://images.unsplash.com/photo-1607344645866-009c320c5ab8?w=500", Anh_Chi_Tiet: "https://images.unsplash.com/photo-1607344645866-009c320c5ab8?w=500", Mo_Ta: "Móc khóa bằng len milk cotton siêu dễ thương.", Chat_Lieu: "Len milk cotton", Gia_Mac_Dinh: 25300, Link_Shopee: "https://shopee.vn", Hang_Co_San: "Có sẵn", Trang_Thai: "Hiện", Bo_Cau_Hinh: "" },
            { Ma_SP: "IN-001", Ten_SP: "In card theo yêu cầu khổ A3", Danh_Muc: "In ấn", Anh_Dai_Dien: "https://images.unsplash.com/photo-1542435503-956c469947f6?w=500", Anh_Chi_Tiet: "https://images.unsplash.com/photo-1542435503-956c469947f6?w=500", Mo_Ta: "In card bo góc dày dặn sắc nét theo yêu cầu riêng.", Chat_Lieu: "Giấy Ford 180gsm", Gia_Mac_Dinh: 5800, Link_Shopee: "https://shopee.vn", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_CARD" },
            { Ma_SP: "IN-002", Ten_SP: "Thiệp cưới nhà INDE cao cấp", Danh_Muc: "In ấn", Anh_Dai_Dien: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500", Anh_Chi_Tiet: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500,https://images.unsplash.com/photo-1607190074257-dd4b7af0309f?w=500", Mo_Ta: "Thiệp cưới độc quyền phối màu nhã nhặn quý phái.", Chat_Lieu: "Giấy Ford nhiều định lượng", Gia_Mac_Dinh: 3200, Link_Shopee: "", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_THIEP" },
            { Ma_SP: "IN-003", Ten_SP: "In decal sữa trắng trong khổ A3", Danh_Muc: "In ấn", Anh_Dai_Dien: "https://images.unsplash.com/photo-1572945281861-68b29f9d342f?w=500", Anh_Chi_Tiet: "https://images.unsplash.com/photo-1572945281861-68b29f9d342f?w=500", Mo_Ta: "Tem nhãn decal chống thấm nước cắt bế thành phẩm.", Chat_Lieu: "Giấy plactis nhựa Trắng", Gia_Mac_Dinh: 26250, Link_Shopee: "https://shopee.vn", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_TEM_STICKER" }
        ];

        // Giả lập các Tab bảng giá phụ được thiết kế theo chuẩn ma trận hàng ngang của PO
        const sheetsPhu = {
            "GIA_TEM_STICKER": {
                headers: ["Mac_Dinh", "Khong_Man", "Co_Man"],
                data: [
                    { Mac_Dinh: "Khong_Man", Khong_Man: 26250, Co_Man: 31500 }
                ]
            },
            "GIA_CARD": {
                headers: ["Mac_Dinh", "In_1_Mat_Khong_Man", "In_2_Mat_Khong_Man", "In_1_Mat_Co_Man", "In_2_Mat_Co_Man"],
                data: [
                    { Mac_Dinh: "In_1_Mat_Khong_Man", In_1_Mat_Khong_Man: 6800, In_2_Mat_Khong_Man: 9500, In_1_Mat_Co_Man: 12200, In_2_Mat_Co_Man: 20300 }
                ]
            },
            "GIA_THIEP": {
                headers: ["Loai_Thiep", "Mac_Dinh", "Kieu_In", "Kich_Thuoc", "Giay_Ford_180gsm", "Giay_Ford_210gsm"],
                data: [
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "Giay_Ford_180gsm | Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3200, Giay_Ford_210gsm: 3300 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3500, Giay_Ford_210gsm: 3700 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 2 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3700, Giay_Ford_210gsm: 3900 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 3 mặt 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3900, Giay_Ford_210gsm: 4000 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 3 mặt 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 4200, Giay_Ford_210gsm: 4400 },
                    { Loai_Thiep: "Thiệp Passport 9 X 20", Mac_Dinh: "Giay_Ford_180gsm | Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Thiệp Passport 9 X 20", Giay_Ford_180gsm: 3600, Giay_Ford_210gsm: 4000 },
                    { Loai_Thiep: "Thiệp Passport 9 X 20", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Thiệp Passport 9 X 20", Giay_Ford_180gsm: 3800, Giay_Ford_210gsm: 4200 }
                ]
            }
        };

        let currentActiveProduct = null;
        let currentImageIndex = 0;
        let currentImagesList = [];

        // Khởi tạo render danh sách sản phẩm ngoài trang chủ
        function initStore() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            
            sheetDanhSachSanPham.filter(p => p.Trang_Thai === "Hiện").forEach(prod => {
                const card = document.createElement('div');
                card.className = "bg-white/70 border border-white/60 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all flex flex-col justify-between cursor-pointer group";
                card.setAttribute('onclick', `openPopup('${prod.Ma_SP}')`);
                
                card.innerHTML = `
                    <div>
                        <div class="relative w-full aspect-square bg-emerald-50 rounded-xl overflow-hidden mb-3 border border-emerald-100/40">
                            <img src="${prod.Anh_Dai_Dien}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-semibold rounded-md ${prod.Hang_Co_San === 'Có sẵn' ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'}">
                                ${prod.Hang_Co_San}
                            </span>
                        </div>
                        <h3 class="font-bold text-sm text-emerald-950 line-clamp-2 mb-1">${prod.Ten_SP}</h3>
                        <p class="text-xs text-emerald-700/60 mb-2">${prod.Danh_Muc} | ${prod.Chat_Lieu}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-emerald-100/40 pt-2 mt-2">
                        <span class="font-extrabold text-emerald-900 text-sm">${Number(prod.Gia_Mac_Dinh).toLocaleString()}đ</span>
                        <span class="text-[11px] text-emerald-700 font-bold bg-white px-2 py-1 rounded-lg border border-emerald-200 group-hover:bg-emerald-800 group-hover:text-white transition-colors">Xem chi tiết</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Đổi tên nhãn kỹ thuật sang tên hiển thị Tiếng Việt chỉn chu
        function formatLabelText(text) {
            return text.replace(/_/g, ' ')
                       .replace(/Khong Man/g, 'Không màng')
                       .replace(/Co Man/g, 'Có màng')
                       .replace(/In 1 Mat/g, 'In 1 mặt')
                       .replace(/In 2 Mat/g, 'In 2 mặt');
        }

        // Mở Popup Chi Tiết & Tự Động Xây Dựng Bảng Giá Đa Nhóm
        function openPopup(maSp) {
            const prod = sheetDanhSachSanPham.find(p => p.Ma_SP === maSp);
            if(!prod) return;
            
            currentActiveProduct = prod;
            currentImageIndex = 0;
            currentImagesList = prod.Anh_Chi_Tiet.split(',').map(url => url.trim());

            // Gán dữ liệu cơ bản
            document.getElementById('popup-title').innerText = prod.Ten_SP;
            document.getElementById('popup-desc').innerText = prod.Mo_Ta;
            document.getElementById('popup-tag').innerText = prod.Hang_Co_San;
            
            // Cấu hình các nút hành động
            document.getElementById('btn-action-zalo').href = shopConfig.Link_Zalo;
            
            if(prod.Link_Shopee && prod.Link_Shopee.trim() !== "") {
                document.getElementById('btn-action-buy').href = prod.Link_Shopee;
                document.getElementById('btn-action-buy').innerHTML = `<i class="fa-solid fa-bag-shopping"></i> MUA TRÊN SHOPEE`;
            } else {
                document.getElementById('btn-action-buy').href = shopConfig.Link_Zalo;
                document.getElementById('btn-action-buy').innerHTML = `<i class="fa-solid fa-bag-shopping"></i> MUA QUA ZALO SHOP`;
            }

            // Hiển thị cụm nút phụ dựa theo trạng thái Hàng có sẵn hay Đặt trước
            const subGroup = document.getElementById('sub-action-group');
            if(prod.Hang_Co_San === 'Có sẵn') {
                subGroup.classList.add('hidden');
            } else {
                subGroup.classList.remove('hidden');
            }

            updatePopupImage();
            
            // XỬ LÝ DỰNG LAYOUT CHECK GIÁ DỰA TRÊN TAB PHỤ
            const checkGiaSection = document.getElementById('check-gia-section');
            const optionsSpace = document.getElementById('dynamic-options-space');
            optionsSpace.innerHTML = '';

            if(!prod.Bo_Cau_Hinh || !sheetsPhu[prod.Bo_Cau_Hinh]) {
                // Kịch bản 1: Hàng có sẵn không có bảng giá cấu hình phụ
                checkGiaSection.classList.add('hidden');
                document.getElementById('popup-price').innerText = Number(prod.Gia_Mac_Dinh).toLocaleString() + "đ";
            } else {
                // Kịch bản 2 & 3: Có bảng cấu hình phụ (Sticker, Card, Thiệp cưới)
                checkGiaSection.classList.remove('hidden');
                const configTab = sheetsPhu[prod.Bo_Cau_Hinh];
                
                if(prod.Bo_Cau_Hinh === 'GIA_THIEP') {
                    // MOCKUP THIỆP CƯỚI: Phân loại dòng - cột phức tạp đan chéo
                    let uniqueLoaiThiep = [...new Set(configTab.data.map(d => d.Loai_Thiep))];
                    let uniqueKieuIn = [...new Set(configTab.data.map(d => d.Kieu_In))];
                    let giayColumns = configTab.headers.filter(h => h.startsWith('Giay_'));

                    // Đọc dòng có chứa thông tin Mặc định của Tab Thiệp
                    const rowWithDef = configTab.data.find(d => d.Mac_Dinh && d.Mac_Dinh.trim() !== "");
                    let defGiay = "", defKieuIn = "";
                    if(rowWithDef) {
                        let parts = rowWithDef.Mac_Dinh.split('|').map(p => p.trim());
                        defGiay = parts[0];
                        defKieuIn = parts[1];
                    }

                    // Dựng Nhóm 1: Loại Thiệp
                    createRadioGroup(optionsSpace, "Loai_Thiep", "Loại thiệp", uniqueLoaiThiep, uniqueLoaiThiep[0]);
                    // Dựng Nhóm 2: Kiểu In
                    createRadioGroup(optionsSpace, "Kieu_In", "Kiểu in", uniqueKieuIn, defKieuIn || uniqueKieuIn[0]);
                    // Dựng Nhóm 3: Loại định lượng Giấy
                    createRadioGroup(optionsSpace, "Loai_Giay", "Độ dày giấy", giayColumns, defGiay || giayColumns[0]);

                } else {
                    // MOCKUP STICKER / CARD: Toàn bộ tùy chọn dàn theo tiêu đề cột nằm ngang
                    const dataRow = configTab.data[0];
                    const defaultOption = dataRow.Mac_Dinh;
                    const availableOptions = configTab.headers.filter(h => h !== 'Mac_Dinh');
                    
                    // Nhận diện xem có cần tự động tách thành 2 nhóm không (Áp dụng cho Card)
                    const hasPrintingAndLaminating = availableOptions.some(o => o.includes('_Mat_'));
                    
                    if(hasPrintingAndLaminating) {
                        // Tự bẻ đôi chuỗi thông minh thành 2 nhóm theo yêu cầu của PO
                        let uniqueMats = ["In_1_Mat", "In_2_Mat"];
                        let uniqueMans = ["Khong_Man", "Co_Man"];
                        
                        let activeMat = defaultOption.includes("In_2_Mat") ? "In_2_Mat" : "In_1_Mat";
                        let activeMan = defaultOption.includes("Co_Man") ? "Co_Man" : "Khong_Man";

                        createRadioGroup(optionsSpace, "Card_Mat", "Số mặt in", uniqueMats, activeMat);
                        createRadioGroup(optionsSpace, "Card_Man", "Chất liệu màng", uniqueMans, activeMan);
                    } else {
                        // Sticker đơn giản chỉ có 1 nhóm màng
                        createRadioGroup(optionsSpace, "Single_Option", "Lựa chọn phân loại", availableOptions, defaultOption);
                    }
                }
                
                // Sau khi dựng xong radio, tính toán giá lần đầu tiên
                calculateDynamicPrice();
            }

            // Hiện popup
            const popup = document.getElementById('detail-popup');
            popup.classList.remove('hidden');
        }

        // Hàm tiện ích tự động kết xuất cụm Radio Button theo chuẩn UX thiết kế
        function createRadioGroup(container, groupName, groupTitle, optionsList, checkedValue) {
            const groupWrap = document.createElement('div');
            groupWrap.className = "flex flex-col gap-1.5";
            
            const titleSpan = document.createElement('span');
            titleSpan.className = "text-[11px] font-bold text-emerald-800/70";
            titleSpan.innerText = groupTitle;
            groupWrap.appendChild(titleSpan);
            
            const optionsFlex = document.createElement('div');
            optionsFlex.className = "flex flex-wrap gap-2";
            
            optionsList.forEach(opt => {
                const isChecked = opt === checkedValue;
                const label = document.createElement('label');
                label.className = `px-3 py-1.5 rounded-lg text-xs font-medium border cursor-pointer transition-all flex items-center gap-1 bg-white/60 text-emerald-950 border-emerald-200/60 hover:bg-white`;
                
                // Thêm sự kiện bắt thay đổi để tính lại giá ngay lập tức
                label.innerHTML = `
                    <input type="radio" name="${groupName}" value="${opt}" ${isChecked ? 'checked' : ''} onchange="calculateDynamicPrice()" class="accent-emerald-800 mr-0.5">
                    ${formatLabelText(opt)}
                `;
                optionsFlex.appendChild(label);
            });
            
            groupWrap.appendChild(optionsFlex);
            container.appendChild(groupWrap);
        }

        // Thuật toán Tính Ma Trận Giá Động Đa Nhóm Theo Đúng Cấu Trúc Sheet
        function calculateDynamicPrice() {
            if (!currentActiveProduct || !currentActiveProduct.Bo_Cau_Hinh) return;
            
            const configCode = currentActiveProduct.Bo_Cau_Hinh;
            const configTab = sheetsPhu[configCode];
            let finalPrice = currentActiveProduct.Gia_Mac_Dinh;

            if (configCode === 'GIA_THIEP') {
                // Logic dò hàng dọc giao hàng ngang dành riêng cho Thiệp Cưới
                const selectedLoaiThiep = document.querySelector(`input[name="Loai_Thiep"]:checked`)?.value;
                const selectedKieuIn = document.querySelector(`input[name="Kieu_In"]:checked`)?.value;
                const selectedGiayCol = document.querySelector(`input[name="Loai_Giay"]:checked`)?.value;

                // Dò dòng khớp đồng thời cả Loại Thiệp và Kiểu In
                const matchedRow = configTab.data.find(d => d.Loai_Thiep === selectedLoaiThiep && d.Kieu_In === selectedKieuIn);
                if (matchedRow && matchedRow[selectedGiayCol] !== undefined) {
                    finalPrice = matchedRow[selectedGiayCol];
                }
            } else {
                // Logic dành cho Sticker và Card
                const dataRow = configTab.data[0];
                const cardMat = document.querySelector(`input[name="Card_Mat"]:checked`)?.value;
                const cardMan = document.querySelector(`input[name="Card_Man"]:checked`)?.value;
                const singleOpt = document.querySelector(`input[name="Single_Option"]:checked`)?.value;

                if (cardMat && cardMan) {
                    // Ghép ngược chuỗi từ 2 nhóm radio (Ví dụ: In_1_Mat + Co_Man -> In_1_Mat_Co_Man)
                    const combinedKey = `${cardMat}_${cardMan}`;
                    if (dataRow[combinedKey] !== undefined) {
                        finalPrice = dataRow[combinedKey];
                    }
                } else if (singleOpt && dataRow[singleOpt] !== undefined) {
                    finalPrice = dataRow[singleOpt];
                }
            }

            // Cập nhật số tiền hiển thị lên màn hình
            document.getElementById('popup-price').innerText = Number(finalPrice).toLocaleString() + "đ";
        }

        // Cập nhật chuyển đổi ảnh trong slider
        function updatePopupImage() {
            if(currentImagesList.length === 0) return;
            
            document.getElementById('popup-main-img').src = currentImagesList[currentImageIndex];
            
            // Xử lý ẩn hiện nút Next ảnh phụ
            const btnNext = document.getElementById('btn-next-img');
            if(currentImagesList.length <= 1) {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnNext.onclick = () => {
                    currentImageIndex = (currentImageIndex + 1) % currentImagesList.length;
                    updatePopupImage();
                };
            }

            // Vẽ các dấu chấm đếm ảnh
            const dotsSpace = document.getElementById('popup-img-dots');
            dotsSpace.innerHTML = '';
            if(currentImagesList.length > 1) {
                currentImagesList.forEach((_, idx) => {
                    const dot = document.createElement('span');
                    dot.className = `w-1.5 h-1.5 rounded-full transition-all ${idx === currentImageIndex ? 'bg-emerald-800 w-3' : 'bg-emerald-800/20'}`;
                    dotsSpace.appendChild(dot);
                });
            }
        }

        // Đóng Popup
        function closePopup() {
            document.getElementById('detail-popup').classList.add('hidden');
            currentActiveProduct = null;
        }

        // Tự động chạy khi tải trang
        window.onload = initStore;
    </script>
</body>
</html>
