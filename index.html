<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Vô Tri // Creative Handmade</title>
    <style>
        :root { 
            --mint-light: #f0f7f5;
            --mint-bg: #e2f4f1; /* Tông nền xanh mint loang nhẹ tinh tế */
            --emerald-dark: #1f4e45; 
            --emerald-soft: #387a6f;
            --emerald-glass: rgba(56, 122, 111, 0.15);
            --text-color: #2c3e50;
            --shopee-color: #ea501f;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; 
            /* Hình nền loang màu nước xanh mint mộc mạc làm chủ đạo */
            background: linear-gradient(135deg, #f5fbf9 0%, var(--mint-bg) 50%, #d4ede8 100%);
            background-attachment: fixed;
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Thanh thông báo phía trên cùng */
        .top-bar {
            background: var(--emerald-dark); color: #ffffff;
            text-align: center; font-size: 13px; letter-spacing: 1px;
            padding: 10px 0; font-weight: 600;
        }
        
        header { 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(31, 78, 69, 0.08);
            position: sticky; top: 0; z-index: 100; 
        }
        
        .nav-container { 
            max-width: 1200px; margin: 0 auto; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 20px; flex-wrap: wrap; gap: 15px;
        }
        
        /* Cấu trúc logo hình tròn hoàn hảo theo Mockup */
        .logo-box { display: flex; align-items: center; gap: 15px; }
        .logo-circle { 
            width: 75px; height: 75px; 
            border-radius: 50%; 
            background: var(--emerald-soft);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(31, 78, 69, 0.15);
            border: 2px solid #ffffff;
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .logo-circle .logo-fallback { color: #ffffff; font-weight: bold; font-size: 13px; text-align: center; padding: 5px; }
        
        /* Danh sách Menu các trang kích hoạt sẵn dạng viên thuốc */
        .menu-categories { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
        .menu-item { 
            font-weight: 700; font-size: 14px; cursor: pointer; 
            padding: 10px 24px; border-radius: 30px; background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(56, 122, 111, 0.25); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            color: var(--emerald-dark); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .menu-item.active, .menu-item:hover { 
            background: var(--emerald-soft); color: #ffffff; border-color: var(--emerald-soft);
            transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56, 122, 111, 0.2);
        }

        /* Khối Tầm Nhìn */
        .vision-container {
            max-width: 1200px; width: 100%; margin: 25px auto 0; padding: 0 20px; box-sizing: border-box;
            display: none; text-align: center;
        }
        .vision-box {
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(5px);
            padding: 15px 25px; border-radius: 20px;
            color: #34495e; font-size: 15px; line-height: 1.6; font-weight: 500;
            max-width: 800px; margin: 0 auto;
            border: 1px dashed rgba(56, 122, 111, 0.3);
        }

        /* Khối Banner 1 Tĩnh độc bản bo góc sâu */
        .hero-banner { 
            max-width: 1200px; width: 100%; margin: 25px auto 0; padding: 0 20px; box-sizing: border-box;
        }
        .banner-wrapper {
            position: relative; width: 100%; border-radius: 24px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(31, 78, 69, 0.08);
            border: 6px solid #ffffff; box-sizing: border-box;
            background: rgba(255, 255, 255, 0.5);
        }
        .banner-wrapper img { width: 100%; height: auto; display: block; object-fit: cover; max-height: 460px; }
        .banner-arrow {
            position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8); width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: var(--emerald-dark); font-size: 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Khu vực Lọc và Sắp xếp */
        .filter-section {
            max-width: 1200px; margin: 30px auto 0; padding: 0 20px; box-sizing: border-box;
            display: flex; justify-content: flex-end; /* Đẩy khối sắp xếp về bên phải theo Mockup */
        }
        .sort-box select {
            padding: 10px 22px; border-radius: 30px; border: 1px solid rgba(56, 122, 111, 0.3);
            background: var(--emerald-soft); color: #ffffff; font-weight: 700; font-size: 14px; outline: none;
            cursor: pointer; box-shadow: 0 4px 12px rgba(31, 78, 69, 0.1);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Grid hiển thị danh sách sản phẩm cấu trúc 4 cột mượt mà */
        .main-content { max-width: 1200px; width: 100%; margin: 20px auto 60px; padding: 0 20px; box-sizing: border-box; flex: 1; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
        
        /* Card sản phẩm bo góc sâu, chữ nằm gọn bên trong vùng màu nước */
        .product-card { 
            background: #ffffff; border-radius: 24px; border: 1px solid rgba(205, 226, 222, 0.5);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; flex-direction: column; position: relative;
            overflow: hidden; box-shadow: 0 6px 18px rgba(31, 78, 69, 0.03);
        }
        .product-card:hover { 
            transform: translateY(-6px); box-shadow: 0 16px 32px rgba(31, 78, 69, 0.08); border-color: rgba(56, 122, 111, 0.4);
        }
        .product-img-wrapper { width: 100%; height: 270px; background: #fafdfc; overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-img { transform: scale(1.04); }
        
        .product-info { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .product-title { font-size: 16px; margin: 0 0 8px 0; font-weight: 700; color: var(--emerald-dark); line-height: 1.4; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--emerald-soft); background: var(--emerald-glass); padding: 6px 12px; border-radius: 12px; display: inline-block; margin: 5px auto 0; }

        /* Badge Trạng thái hàng hóa tinh tế nằm góc trên card */
        .badge-status { 
            position: absolute; top: 15px; left: 15px; color: var(--emerald-dark); background: #ffffff; 
            padding: 5px 14px; font-size: 11px; font-weight: 700; border-radius: 30px; z-index: 2; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid rgba(31, 78, 69, 0.1);
        }

        /* Thiết lập Footer nằm dưới cùng */
        footer {
            background: rgba(255, 255, 255, 0.8); border-top: 1px solid rgba(31, 78, 69, 0.08); padding: 40px 20px;
            text-align: center; margin-top: auto; backdrop-filter: blur(10px);
        }
        .footer-content { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .footer-links { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        
        /* Nút mờ liên kết MXH hình tròn dẹt bầu bĩnh ở footer */
        .footer-btn {
            text-decoration: none; font-weight: 700; font-size: 14px; padding: 10px 28px; border-radius: 30px;
            transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .btn-fb { background: #eaf2f9; color: #1877f2; }
        .btn-zl { background: #edf5f7; color: #0068ff; }
        .btn-sp { background: #fff2ee; color: var(--shopee-color); }
        .footer-btn:hover { opacity: 0.85; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.05); }
        .footer-copy { font-size: 13px; color: #a0aec0; margin: 0; font-weight: 500; }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; text-align: center; }
            .filter-section { justify-content: center; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">🌸 CỬA HÀNG VÔ TRI // CREATIVE HANDMADE & PRINTING 🌸</div>

    <header>
        <div class="nav-container">
            <div class="logo-box">
                <!-- Vùng ảnh Logo hình tròn bo góc hoàn hảo -->
                <div class="logo-circle" id="shop-logo-box">
                    <div class="logo-fallback">VÔ TRI</div>
                </div>
            </div>
            <!-- Danh sách menu điều hướng các trang bật sẵn trạng thái Active -->
            <nav>
                <ul class="menu-categories" id="main-nav-menu">
                    <li class="menu-item active">Home</li>
                    <li class="menu-item">Đồ len</li>
                    <li class="menu-item">In ấn</li>
                    <li class="menu-item">Giấy</li>
                    <li class="menu-item">In 3D</li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Khối Tầm Nhìn thơ mộng của shop -->
    <div class="vision-container" id="vision-area">
        <div class="vision-box" id="vision-text-box"></div>
    </div>

    <!-- Khối Banner 1 tĩnh độc bản cố định bo góc sâu -->
    <div class="hero-banner" id="banner-root-area" style="display: none;">
        <div class="banner-wrapper">
            <img id="static-banner-img" src="" alt="Banner Shop">
            <div class="banner-arrow">&gt;</div>
        </div>
    </div>

    <!-- Khu vực Lọc & Sắp xếp nằm bên phải ngay trên Grid -->
    <div class="filter-section">
        <div class="sort-box">
            <select id="sort-selector" onchange="renderProductsGrid()">
                <option value="default">SẮP XẾP: MỚI NHẤT v</option>
                <option value="price-asc">GIÁ: THẤP ĐẾN CAO</option>
                <option value="price-desc">GIÁ: CAO ĐẾN THẤP</option>
            </select>
        </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="main-content">
        <div class="product-grid" id="product-list-view"></div>
    </div>

    <!-- Phần chân trang Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links" id="footer-social-links"></div>
            <p class="footer-copy">© 2026 CỬA HÀNG VÔ TRI. POWERED BY IN.</p>
        </div>
    </footer>

    <script>
        // ID Bảng tính Google Sheets cốt lõi của shop
        const SPREADSHEET_ID = '1PPmMOIynpRpP7ygb7OpS6GWuIuu8WslWOQgu_gfwHe0'; 
        let globalStoreData = { products: [], config: {} };

        // Hàm đọc thô nguyên văn dữ liệu từ Sheets
        async function fetchSheetRows(sheetName) {
            try {
                const response = await fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${sheetName}`);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                return json.table.rows;
            } catch (e) { 
                console.error("Lỗi fetch sheet: " + sheetName, e); 
                return []; 
            }
        }

        // Khởi tạo và đồng bộ hóa tầng dữ liệu cho Trang Chủ (Sprint 1)
        async function initSprint1HomePage() {
            // 1. Đọc dữ liệu tab cấu hình shop (Tiêu đề dòng 5, data chạy từ dòng 6)
            const configRows = await fetchSheetRows('Cau_Hinh_Shop');
            configRows.forEach(row => {
                if(row && row.c && row.c[0] && row.c[1]) {
                    globalStoreData.config[row.c[0].v] = row.c[1].v;
                }
            });

            // Gắn ảnh Logo thô vào khung tròn
            if(globalStoreData.config['Logo_Shop']) {
                document.getElementById('shop-logo-box').innerHTML = `
                    <img src="${String(globalStoreData.config['Logo_Shop']).trim()}" alt="Logo Shop" onerror="this.parentElement.innerHTML='<div class=\'logo-fallback\'>VÔ TRI</div>';">
                `;
            }

            // Gắn mô tả tầm nhìn shop
            if(globalStoreData.config['Tam_Nhin'] && String(globalStoreData.config['Tam_Nhin']).trim() !== "") {
                document.getElementById('vision-text-box').innerText = `"${globalStoreData.config['Tam_Nhin']}"`;
                document.getElementById('vision-area').style.display = 'block';
            }

            // Gắn cứng Banner_1 thô vào vùng hiển thị tĩnh theo yêu cầu Mockup
            if(globalStoreData.config['Banner_1']) {
                document.getElementById('static-banner-img').src = String(globalStoreData.config['Banner_1']).trim();
                document.getElementById('banner-root-area').style.display = 'block';
            }

            // Khởi tạo các liên kết ở chân trang Footer
            renderFooterSocials();

            // 2. Đọc dữ liệu Danh sách sản phẩm (Tiêu đề dòng 5, data chạy từ dòng 6)
            const productRows = await fetchSheetRows('Danh_Sach_SanPham');
            
            productRows.forEach((row, idx) => {
                if(row && row.c && row.c[1]) { // Đảm bảo cột tên sản phẩm có dữ liệu
                    const pCode = row.c[0] ? String(row.c[0].v).trim() : ''; 
                    const pName = row.c[1] ? String(row.c[1].v).trim() : ''; 
                    const pCat  = row.c[2] ? String(row.c[2].v).trim() : 'KHÁC'; 
                    const pImg  = row.c[3] ? String(row.c[3].v).trim() : ''; 
                    const pStock = row.c[9] ? String(row.c[9].v).trim() : 'Có sẵn'; 
                    const pVis  = row.c[10] ? String(row.c[10].v).trim() : 'Hiện'; 
                    const pConfig = row.c[11] ? String(row.c[11].v).trim() : ''; 
                    
                    let pPrice = 0;
                    if(row.c[7] && row.c[7].v) {
                        pPrice = parseFloat(String(row.c[7].v).replace(/[^0-9.-]+/g, "")) || 0;
                    }

                    // Điều kiện nghiệp vụ: Chỉ lấy sản phẩm có trạng thái là "Hiện"
                    if(pName && pVis.toLowerCase() === 'hiện') {
                        globalStoreData.products.push({
                            sheetIndex: idx, // Dùng để xác định vị trí dòng thực tế
                            code: pCode, 
                            name: pName, 
                            category: pCat,
                            img: pImg, 
                            basePrice: pPrice, 
                            stock: pStock, 
                            hasConfig: pConfig !== ""
                        });
                    }
                }
            });

            // Tiến hành vẽ sản phẩm lên giao diện
            renderProductsGrid();
        }

        // Hàm kết xuất danh sách liên kết mạng xã hội
        function renderFooterSocials() {
            const container = document.getElementById('footer-social-links');
            let htmlLinks = '';
            if(globalStoreData.config['Link_FB']) htmlLinks += `<a href="${globalStoreData.config['Link_FB']}" target="_blank" class="footer-btn btn-fb">Facebook</a>`;
            if(globalStoreData.config['Link_Zalo']) htmlLinks += `<a href="${globalStoreData.config['Link_Zalo']}" target="_blank" class="footer-btn btn-zl">Zalo Shop</a>`;
            if(globalStoreData.config['Link_Shopee_Chung']) htmlLinks += `<a href="${globalStoreData.config['Link_Shopee_Chung']}" target="_blank" class="footer-btn btn-sp">Shopee</a>`;
            container.innerHTML = htmlLinks;
        }

        // Hàm xử lý sắp xếp và vẽ lưới sản phẩm lên màn hình trang chủ
        function renderProductsGrid() {
            const container = document.getElementById('product-list-view');
            const sortVal = document.getElementById('sort-selector').value;

            let displayList = [...globalStoreData.products];

            // Áp dụng các bộ lọc sắp xếp
            if (sortVal === 'default') {
                // Sắp xếp mặc định: Mới nhất (sản phẩm nằm ở dòng dưới cùng của Sheets lên đầu tiên)
                displayList.sort((a, b) => b.sheetIndex - a.sheetIndex);
            } else if (sortVal === 'price-asc') {
                displayList.sort((a, b) => a.basePrice - b.basePrice);
            } else if (sortVal === 'price-desc') {
                displayList.sort((a, b) => b.basePrice - a.basePrice);
            }

            if(displayList.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px 0; font-weight: bold; color: var(--emerald-soft);">Không tìm thấy sản phẩm nào để hiển thị.</div>`;
                return;
            }

            // Kết xuất bản đồ card sản phẩm bo góc sâu tinh tế theo bố cục Mockup
            container.innerHTML = displayList.map(p => {
                return `
                    <div class="product-card">
                        <span class="badge-status">${p.stock}</span>
                        <div class="product-img-wrapper">
                            <img class="product-img" src="${p.img || 'https://via.placeholder.com/400?text=Cua+Hang+Vo+Tri'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400?text=Hình+ảnh+đang+tải...';">
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">
                                ${p.hasConfig ? 'Giá theo yêu cầu' : Number(p.basePrice).toLocaleString('vi-VN') + ' đ'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Tự động kích hoạt khi trang web load hoàn tất
        window.onload = initSprint1HomePage;
    </script>
</body>
</html>
