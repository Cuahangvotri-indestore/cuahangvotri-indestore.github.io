<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Vô Tri - Creative Handmade & Printing</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e6f2ee;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* Style kính mờ nâng cao riêng cho Popup Sprint 2 */
        .glass-modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(45, 90, 75, 0.15);
        }
        .popup-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .popup-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }
        .popup-scroll::-webkit-scrollbar-thumb {
            background: rgba(45, 90, 75, 0.15);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center justify-start">

    <!-- KHUNG TRANG CHỦ MOCKUP CHÍNH BẢN 21:03 -->
    <div class="w-full max-w-6xl glass-panel rounded-3xl p-6 shadow-xl relative overflow-hidden mb-8">
        <!-- Header Shop -->
        <div class="flex flex-col md:flex-row items-center justify-between border-b border-emerald-100 pb-6 mb-6 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-emerald-700/10 flex items-center justify-center font-bold text-emerald-800 text-center text-xs p-2 border border-emerald-200">
                    ẢNH LOGO
                </div>
                <div>
                    <h1 class="text-xl font-bold text-emerald-950 flex items-center gap-2">
                        🌸 CỬA HÀNG VÔ TRI 🌸
                    </h1>
                    <p class="text-xs text-emerald-700 font-medium">CREATIVE HANDMADE & PRINTING</p>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="px-4 py-1.5 bg-emerald-800 text-white font-semibold rounded-full text-xs shadow-sm">IN 3D</span>
                <span class="px-4 py-1.5 bg-white/80 text-emerald-900 font-medium rounded-full text-xs border border-emerald-200/60 shadow-sm flex items-center gap-1">
                    MỚI NHẤT <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </span>
            </div>
        </div>

        <!-- Khung sản phẩm hiển thị chuẩn bản 21:03 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="product-list">
            <!-- Dữ liệu render động đổ vào đây -->
        </div>
    </div>

    <!-- POPUP CHI TIẾT SẢN PHẨM SPRINT 2 (Không làm ảnh hưởng đến giao diện chính) -->
    <div id="detail-popup" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm hidden transition-all duration-300">
        <div class="w-full max-w-4xl glass-modal rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-[90vh] md:max-h-[85vh] relative">
            
            <!-- Nút đóng (X) -->
            <button onclick="closePopup()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/80 hover:bg-white text-emerald-950 flex items-center justify-center transition-all border border-emerald-200/40 z-10 cursor-pointer shadow-sm">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Cột trái: Slide Ảnh chi tiết -->
            <div class="w-full md:w-1/2 p-6 flex flex-col justify-between bg-white/40 border-b md:border-b-0 md:border-r border-emerald-100/50">
                <div class="relative flex-1 flex items-center justify-center min-h-[260px] md:min-h-[340px]">
                    <span id="popup-tag" class="absolute top-0 left-0 px-2.5 py-1 bg-white border border-emerald-200/60 text-emerald-800 font-medium text-[11px] rounded-md shadow-sm">
                        Đặt trước
                    </span>
                    <img id="popup-main-img" src="" alt="Sản phẩm" class="max-w-full max-h-[320px] object-contain rounded-2xl shadow-sm border border-white">
                    
                    <button id="btn-next-img" class="absolute right-2 w-8 h-8 rounded-full bg-emerald-900/10 hover:bg-emerald-900/20 text-emerald-900 flex items-center justify-center transition-all cursor-pointer">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <div id="popup-img-dots" class="flex justify-center gap-1.5 mt-3"></div>
            </div>

            <!-- Cột phải: Thông tin & Ma trận giá cố định -->
            <div class="w-full md:w-1/2 p-6 flex flex-col justify-between overflow-y-auto popup-scroll">
                <div>
                    <h2 id="popup-title" class="text-lg font-bold text-emerald-950 mb-2 pr-6">TÊN SẢN PHẨM</h2>
                    
                    <div class="mb-4">
                        <span class="text-[10px] font-bold tracking-wider text-emerald-800/60 uppercase block mb-1">MÔ TẢ</span>
                        <div id="popup-desc" class="text-xs text-emerald-900/80 bg-white/50 border border-white rounded-xl p-3 max-h-[90px] overflow-y-auto leading-relaxed">
                            Mô tả sản phẩm
                        </div>
                    </div>

                    <div class="mb-4 flex items-baseline gap-2 bg-emerald-900/5 p-3 rounded-xl border border-emerald-950/5">
                        <span class="text-[11px] font-bold text-emerald-800">GIÁ HIỂN THỊ:</span>
                        <span id="popup-price" class="text-xl font-black text-emerald-900">0đ</span>
                    </div>

                    <!-- KHUNG CHECK GIÁ ĐỘNG TỰ SINH -->
                    <div id="check-gia-section" class="mb-4 bg-white/60 border border-emerald-100/60 rounded-2xl p-4 shadow-sm hidden">
                        <h3 class="text-[11px] font-bold text-emerald-900 tracking-wider uppercase border-b border-emerald-100/40 pb-1.5 mb-3 flex items-center gap-1.5">
                            <i class="fa-solid fa-calculator text-emerald-700"></i> CHECK GIÁ TÙY CHỌN
                        </h3>
                        <div id="dynamic-options-space" class="space-y-3.5 max-h-[200px] overflow-y-auto pr-1 popup-scroll">
                            <!-- Nút Radio tự sinh từ Tab sheet -->
                        </div>
                    </div>
                </div>

                <!-- BỘ BA NÚT HÀNH ĐỘNG HẠNG NẶNG -->
                <div class="flex flex-col gap-2 mt-4 pt-4 border-t border-emerald-100/60">
                    <a id="btn-action-buy" href="#" target="_blank" class="w-full py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl text-center text-xs tracking-wide shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-bag-shopping"></i> MUA NHÉ
                    </a>
                    
                    <div class="grid grid-cols-2 gap-2" id="sub-action-group">
                        <button onclick="alert('Tính năng điền form thông tin yêu cầu thiết kế sẽ được cập nhật ở Sprint sau nha PO!')" class="py-2 bg-white hover:bg-emerald-50 text-emerald-900 font-bold border border-emerald-200/80 rounded-xl text-[11px] transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-file-pen text-emerald-700"></i> XIN TÍ INFO
                        </button>
                        <a id="btn-action-zalo" href="#" target="_blank" class="py-2 bg-white hover:bg-emerald-50 text-emerald-900 font-bold border border-emerald-200/80 rounded-xl text-[11px] transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-brands fa-square-zalo text-blue-500 text-sm"></i> TƯ VẤN ZALO
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MÃ NGUỒN LOGIC ĐA SHEET & MAPPING MA TRẬN GIÁ -->
    <script>
        const shopConfig = {
            Link_Zalo: "http://zaloapp.com/qr/p/14jxxuqxy1zbj"
        };

        const sheetDanhSachSanPham = [
            { Ma_SP: "LEN-001", Ten_SP: "Móc khóa len vô tri", Danh_Muc: "Đồ len", Anh_Dai_Dien: "images/LENOO2_1.png", Anh_Chi_Tiet: "images/LENOO2_1.png", Mo_Ta: "Móc khóa bằng len milk cotton vô tri siêu ngộ nghĩnh.", Chat_Lieu: "Len milk cotton", Gia_Mac_Dinh: 25300, Link_Shopee: "https://shopee.vn", Hang_Co_San: "Có sẵn", Trang_Thai: "Hiện", Bo_Cau_Hinh: "" },
            { Ma_SP: "IN-001", Ten_SP: "In card theo yêu cầu khổ A3 - 1 tờ - in 1 mặt (Giấy Ford 180gsm)", Danh_Muc: "In ấn", Anh_Dai_Dien: "images/INOO2_1.png", Anh_Chi_Tiet: "images/INOO2_1.png", Mo_Ta: "In card theo yêu cầu chất lượng cao, sắc nét.", Chat_Lieu: "Giấy Ford 180gsm", Gia_Mac_Dinh: 5800, Link_Shopee: "https://shopee.vn", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_CARD" },
            { Ma_SP: "IN-002", Ten_SP: "Thiệp cưới nhà INDE", Danh_Muc: "In ấn", Anh_Dai_Dien: "images/INOO2_1.png", Anh_Chi_Tiet: "images/INOO2_1.png, images/INOO2_1.png", Mo_Ta: "In thiệp cưới theo mẫu thiết kế độc quyền tinh tế.", Chat_Lieu: "Giấy Ford 180gsm", Gia_Mac_Dinh: 3200, Link_Shopee: "", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_THIEP" },
            { Ma_SP: "IN-003", Ten_SP: "In decal sữa trắng/ trong khổ A3 - 1 tờ", Danh_Muc: "In ấn", Anh_Dai_Dien: "images/INOO4_1.png", Anh_Chi_Tiet: "images/INOO4_1.png", Mo_Ta: "In decal theo yêu cầu chất liệu nhựa chống thấm nước tốt.", Chat_Lieu: "Giấy plactis nhựa Trắng", Gia_Mac_Dinh: 12900, Link_Shopee: "", Hang_Co_San: "Đặt trước", Trang_Thai: "Hiện", Bo_Cau_Hinh: "GIA_TEM_STICKER" }
        ];

        const sheetsPhu = {
            "GIA_TEM_STICKER": {
                headers: ["Mac_Dinh", "Khong_Man", "Co_Man"],
                data: [
                    { Mac_Dinh: "Khong_Man", Khong_Man: 26250, Co_Man: 31500 }
                ]
            },
            "GIA_CARD": {
                headers: ["Mac_Dinh", "In_1_Mat_Khong_Man", "In_2_Mat_Khong_Man", "In_1_Mat_Co_Man", "In_2_Mat_Co_Man"],
                data: [
                    { Mac_Dinh: "In_1_Mat_Khong_Man", In_1_Mat_Khong_Man: 6800, In_2_Mat_Khong_Man: 9500, In_1_Mat_Co_Man: 12200, In_2_Mat_Co_Man: 20300 }
                ]
            },
            "GIA_THIEP": {
                headers: ["Loai_Thiep", "Mac_Dinh", "Kieu_In", "Kich_Thuoc", "Giay_Ford_180gsm", "Giay_Ford_210gsm"],
                data: [
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "Giay_Ford_180gsm | Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3200, Giay_Ford_210gsm: 3300 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3500, Giay_Ford_210gsm: 3700 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 2 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3700, Giay_Ford_210gsm: 3900 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 3 mặt 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 3900, Giay_Ford_210gsm: 4000 },
                    { Loai_Thiep: "Bao thư 12.5x18.5", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 3 mặt 1 mặt", Kich_Thuoc: "Bao thư 12.5x18.5", Giay_Ford_180gsm: 4200, Giay_Ford_210gsm: 4400 },
                    { Loai_Thiep: "Thiệp Passport 9 X 20", Mac_Dinh: "Giay_Ford_180gsm | Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kieu_In: "Full màu vỏ 1 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Thiệp Passport 9 X 20", Giay_Ford_180gsm: 3600, Giay_Ford_210gsm: 4000 },
                    { Loai_Thiep: "Thiệp Passport 9 X 20", Mac_Dinh: "", Kieu_In: "Full màu vỏ 2 mặt + full màu ruột 1 mặt", Kich_Thuoc: "Thiệp Passport 9 X 20", Giay_Ford_180gsm: 3800, Giay_Ford_210gsm: 4200 }
                ]
            }
        };

        let currentActiveProduct = null;
        let currentImageIndex = 0;
        let currentImagesList = [];

        function initStore() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            
            sheetDanhSachSanPham.filter(p => p.Trang_Thai === "Hiện").forEach(prod => {
                const card = document.createElement('div');
                card.className = "bg-white/70 border border-white/60 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all flex flex-col justify-between cursor-pointer group";
                card.setAttribute('onclick', `openPopup('${prod.Ma_SP}')`);
                
                const imgSrc = prod.Anh_Dai_Dien ? prod.Anh_Dai_Dien : 'https://images.unsplash.com/photo-1607344645866-009c320c5ab8?w=500';

                card.innerHTML = `
                    <div>
                        <div class="relative w-full aspect-square bg-emerald-50 rounded-xl overflow-hidden mb-3 border border-emerald-100/40">
                            <img src="${imgSrc}" onerror="this.src='https://images.unsplash.com/photo-1542435503-956c469947f6?w=500'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-semibold rounded-md ${prod.Hang_Co_San === 'Có sẵn' ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800'}">
                                ${prod.Hang_Co_San}
                            </span>
                        </div>
                        <h3 class="font-bold text-sm text-emerald-950 line-clamp-2 mb-1">${prod.Ten_SP}</h3>
                        <p class="text-xs text-emerald-700/60 mb-2">${prod.Danh_Muc} | ${prod.Chat_Lieu}</p>
                    </div>
                    <div class="flex items-center justify-between border-t border-emerald-100/40 pt-2 mt-2">
                        <span class="font-extrabold text-emerald-900 text-sm">${Number(prod.Gia_Mac_Dinh).toLocaleString()}đ</span>
                        <span class="text-[11px] text-emerald-700 font-bold bg-white px-2 py-1 rounded-lg border border-emerald-200 group-hover:bg-emerald-800 group-hover:text-white transition-colors">Xem chi tiết</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function formatLabelText(text) {
            return text.replace(/_/g, ' ')
                       .replace(/Khong Man/g, 'Không màng')
                       .replace(/Co Man/g, 'Có màng')
                       .replace(/In 1 Mat/g, 'In 1 mặt')
                       .replace(/In 2 Mat/g, 'In 2 mặt')
                       .replace(/Giay_Ford_/g, 'Giấy Ford ');
        }

        function openPopup(maSp) {
            const prod = sheetDanhSachSanPham.find(p => p.Ma_SP === maSp);
            if(!prod) return;
            
            currentActiveProduct = prod;
            currentImageIndex = 0;
            currentImagesList = prod.Anh_Chi_Tiet.split(',').map(url => url.trim());

            document.getElementById('popup-title').innerText = prod.Ten_SP;
            document.getElementById('popup-desc').innerText = prod.Mo_Ta;
            document.getElementById('popup-tag').innerText = prod.Hang_Co_San;
            
            document.getElementById('btn-action-zalo').href = shopConfig.Link_Zalo;
            
            if(prod.Link_Shopee && prod.Link_Shopee.trim() !== "") {
                document.getElementById('btn-action-buy').href = prod.Link_Shopee;
                document.getElementById('btn-action-buy').innerHTML = `<i class="fa-solid fa-bag-shopping"></i> MUA TRÊN SHOPEE`;
            } else {
                document.getElementById('btn-action-buy').href = shopConfig.Link_Zalo;
                document.getElementById('btn-action-buy').innerHTML = `<i class="fa-solid fa-bag-shopping"></i> MUA QUA ZALO SHOP`;
            }

            const subGroup = document.getElementById('sub-action-group');
            if(prod.Hang_Co_San === 'Có sẵn') {
                subGroup.classList.add('hidden');
            } else {
                subGroup.classList.remove('hidden');
            }

            updatePopupImage();
            
            const checkGiaSection = document.getElementById('check-gia-section');
            const optionsSpace = document.getElementById('dynamic-options-space');
            optionsSpace.innerHTML = '';

            if(!prod.Bo_Cau_Hinh || !sheetsPhu[prod.Bo_Cau_Hinh]) {
                checkGiaSection.classList.add('hidden');
                document.getElementById('popup-price').innerText = Number(prod.Gia_Mac_Dinh).toLocaleString() + "đ";
            } else {
                checkGiaSection.classList.remove('hidden');
                const configTab = sheetsPhu[prod.Bo_Cau_Hinh];
                
                if(prod.Bo_Cau_Hinh === 'GIA_THIEP') {
                    let uniqueLoaiThiep = [...new Set(configTab.data.map(d => d.Loai_Thiep))];
                    let uniqueKieuIn = [...new Set(configTab.data.map(d => d.Kieu_In))];
                    let giayColumns = configTab.headers.filter(h => h.startsWith('Giay_'));

                    const rowWithDef = configTab.data.find(d => d.Mac_Dinh && d.Mac_Dinh.trim() !== "");
                    let defGiay = "", defKieuIn = "";
                    if(rowWithDef) {
                        let parts = rowWithDef.Mac_Dinh.split('|').map(p => p.trim());
                        defGiay = parts[0];
                        defKieuIn = parts[1];
                    }

                    createRadioGroup(optionsSpace, "Loai_Thiep", "Loại thiệp:", uniqueLoaiThiep, uniqueLoaiThiep[0]);
                    createRadioGroup(optionsSpace, "Kieu_In", "Kiểu in:", uniqueKieuIn, defKieuIn || uniqueKieuIn[0]);
                    createRadioGroup(optionsSpace, "Loai_Giay", "Chất liệu giấy:", giayColumns, defGiay || giayColumns[0]);

                } else {
                    const dataRow = configTab.data[0];
                    const defaultOption = dataRow.Mac_Dinh;
                    const availableOptions = configTab.headers.filter(h => h !== 'Mac_Dinh');
                    
                    const hasPrintingAndLaminating = availableOptions.some(o => o.includes('_Mat_'));
                    
                    if(hasPrintingAndLaminating) {
                        let uniqueMats = ["In_1_Mat", "In_2_Mat"];
                        let uniqueMans = ["Khong_Man", "Co_Man"];
                        
                        let activeMat = defaultOption.includes("In_2_Mat") ? "In_2_Mat" : "In_1_Mat";
                        let activeMan = defaultOption.includes("Co_Man") ? "Co_Man" : "Khong_Man";

                        createRadioGroup(optionsSpace, "Card_Mat", "Số mặt in:", uniqueMats, activeMat);
                        createRadioGroup(optionsSpace, "Card_Man", "Chất liệu màng:", uniqueMans, activeMan);
                    } else {
                        createRadioGroup(optionsSpace, "Single_Option", "Lựa chọn phân loại:", availableOptions, defaultOption);
                    }
                }
                
                calculateDynamicPrice();
            }

            document.getElementById('detail-popup').classList.remove('hidden');
        }

        function createRadioGroup(container, groupName, groupTitle, optionsList, checkedValue) {
            const groupWrap = document.createElement('div');
            groupWrap.className = "flex flex-col gap-1";
            
            const titleSpan = document.createElement('span');
            titleSpan.className = "text-[11px] font-bold text-emerald-800/70";
            titleSpan.innerText = groupTitle;
            groupWrap.appendChild(titleSpan);
            
            const optionsFlex = document.createElement('div');
            optionsFlex.className = "flex flex-wrap gap-1.5";
            
            optionsList.forEach(opt => {
                const isChecked = opt === checkedValue;
                const label = document.createElement('label');
                label.className = `px-2.5 py-1 rounded-lg text-[11px] font-medium border cursor-pointer transition-all flex items-center gap-1 bg-white text-emerald-950 border-emerald-200/40 hover:bg-emerald-50/50`;
                
                label.innerHTML = `
                    <input type="radio" name="${groupName}" value="${opt}" ${isChecked ? 'checked' : ''} onchange="calculateDynamicPrice()" class="accent-emerald-800 scale-90">
                    ${formatLabelText(opt)}
                `;
                optionsFlex.appendChild(label);
            });
            
            groupWrap.appendChild(optionsFlex);
            container.appendChild(groupWrap);
        }

        function calculateDynamicPrice() {
            if (!currentActiveProduct || !currentActiveProduct.Bo_Cau_Hinh) return;
            
            const configCode = currentActiveProduct.Bo_Cau_Hinh;
            const configTab = sheetsPhu[configCode];
            let finalPrice = currentActiveProduct.Gia_Mac_Dinh;

            if (configCode === 'GIA_THIEP') {
                const selectedLoaiThiep = document.querySelector(`input[name="Loai_Thiep"]:checked`)?.value;
                const selectedKieuIn = document.querySelector(`input[name="Kieu_In"]:checked`)?.value;
                const selectedGiayCol = document.querySelector(`input[name="Loai_Giay"]:checked`)?.value;

                const matchedRow = configTab.data.find(d => d.Loai_Thiep === selectedLoaiThiep && d.Kieu_In === selectedKieuIn);
                if (matchedRow && matchedRow[selectedGiayCol] !== undefined) {
                    finalPrice = matchedRow[selectedGiayCol];
                }
            } else {
                const dataRow = configTab.data[0];
                const cardMat = document.querySelector(`input[name="Card_Mat"]:checked`)?.value;
                const cardMan = document.querySelector(`input[name="Card_Man"]:checked`)?.value;
                const singleOpt = document.querySelector(`input[name="Single_Option"]:checked`)?.value;

                if (cardMat && cardMan) {
                    const combinedKey = `${cardMat}_${cardMan}`;
                    if (dataRow[combinedKey] !== undefined) {
                        finalPrice = dataRow[combinedKey];
                    }
                } else if (singleOpt && dataRow[singleOpt] !== undefined) {
                    finalPrice = dataRow[singleOpt];
                }
            }

            document.getElementById('popup-price').innerText = Number(finalPrice).toLocaleString() + "đ";
        }

        function updatePopupImage() {
            if(currentImagesList.length === 0) return;
            
            const mainImg = document.getElementById('popup-main-img');
            mainImg.src = currentImagesList[currentImageIndex];
            mainImg.onerror = function() {
                this.src = 'https://images.unsplash.com/photo-1542435503-956c469947f6?w=500';
            };
            
            const btnNext = document.getElementById('btn-next-img');
            if(currentImagesList.length <= 1) {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnNext.onclick = () => {
                    currentImageIndex = (currentImageIndex + 1) % currentImagesList.length;
                    updatePopupImage();
                };
            }

            const dotsSpace = document.getElementById('popup-img-dots');
            dotsSpace.innerHTML = '';
            if(currentImagesList.length > 1) {
                currentImagesList.forEach((_, idx) => {
                    const dot = document.createElement('span');
                    dot.className = `w-1 h-1 rounded-full transition-all ${idx === currentImageIndex ? 'bg-emerald-800 w-2.5' : 'bg-emerald-800/20'}`;
                    dotsSpace.appendChild(dot);
                });
            }
        }

        function closePopup() {
            document.getElementById('detail-popup').classList.add('hidden');
            currentActiveProduct = null;
        }

        window.onload = initStore;
    </script>
</body>
</html>
