<script>
        const SPREADSHEET_ID = '1PPmMOIynpRpP7ygb7OpS6GWuIuu8WslWOQgu_gfwHe0'; 
        let globalStoreData = { products: [], reviews: [], config: {} };
        let currentSortValue = 'default';
        let popupActiveItem = null, popupActiveImgIndex = 0, popupImagesArray = [], popupAutoplayInterval = null; 

        let dynamicSheetsPhuMatrix = {};

        async function loadDynamicPriceMatrices() {
            try {
                // Tải bảng giá Thệp chuẩn xác theo đúng vị trí cột từ Google Sheets
                const thiepRows = await fetchSheetRows('GIA_THIEP');
                let thiepData = [];
                thiepRows.forEach(row => {
                    if (row && row.c && row.c[0] && row.c[0].v) {
                        let loaiThiep = row.c[0].v ? String(row.c[0].v).trim() : '';
                        let macDinh = row.c[1] && row.c[1].v ? String(row.c[1].v).trim() : '';
                        let kieuIn = row.c[2] && row.c[2].v ? String(row.c[2].v).trim() : '';
                        let kichThuoc = row.c[3] && row.c[3].v ? String(row.c[3].v).trim() : '';
                        
                        // Cột 4 (index 4) là Giay_Ford_180gsm, Cột 5 (index 5) là Giay_Ford_210gsm
                        let g180Val = row.c[4] && row.c[4].v ? row.c[4].v : 0;
                        let g210Val = row.c[5] && row.c[5].v ? row.c[5].v : 0;

                        let g180 = (String(g180Val).toLowerCase().includes('chưa có')) ? "Chưa có" : (parseFloat(String(g180Val).replace(/[^0-9.-]+/g, "")) || 0);
                        let g210 = (String(g210Val).toLowerCase().includes('chưa có')) ? "Chưa có" : (parseFloat(String(g210Val).replace(/[^0-9.-]+/g, "")) || 0);
                        
                        if (loaiThiep.toLowerCase() !== 'loai_thiep') {
                            thiepData.push({
                                Loai_Thiep: loaiThiep,
                                Mac_Dinh: macDinh,
                                Kieu_In: kieuIn,
                                Kich_Thuoc: kichThuoc,
                                Giay_Ford_180gsm: g180,
                                Giay_Ford_210gsm: g210
                            });
                        }
                    }
                });
                dynamicSheetsPhuMatrix["GIA_THIEP"] = {
                    headers: ["Loai_Thiep", "Mac_Dinh", "Kieu_In", "Kich_Thuoc", "Giay_Ford_180gsm", "Giay_Ford_210gsm"],
                    data: thiepData
                };

                // Tải bảng giá Card
                const cardRows = await fetchSheetRows('GIA_CARD');
                if (cardRows && cardRows.length > 0) {
                    let cardRowObj = {};
                    cardRows.forEach(row => {
                        if (row && row.c && row.c[0] && row.c[0].v) {
                            let key = String(row.c[0].v).trim();
                            let val = row.c[1] && row.c[1].v ? parseFloat(String(row.c[1].v).replace(/[^0-9.-]+/g, "")) || 0 : 0;
                            cardRowObj[key] = val;
                        }
                    });
                    dynamicSheetsPhuMatrix["GIA_CARD"] = {
                        headers: ["Mac_Dinh", "In_1_Mat_Khong_Man", "In_2_Mat_Khong_Man", "In_1_Mat_Co_Man", "In_2_Mat_Co_Man"],
                        data: [cardRowObj]
                    };
                }

                // Tải bảng giá Tem Sticker
                const stickerRows = await fetchSheetRows('GIA_TEM_STICKER');
                if (stickerRows && stickerRows.length > 0) {
                    let stickerRowObj = {};
                    stickerRows.forEach(row => {
                        if (row && row.c && row.c[0] && row.c[0].v) {
                            let key = String(row.c[0].v).trim();
                            let val = row.c[1] && row.c[1].v ? parseFloat(String(row.c[1].v).replace(/[^0-9.-]+/g, "")) || 0 : 0;
                            stickerRowObj[key] = val;
                        }
                    });
                    dynamicSheetsPhuMatrix["GIA_TEM_STICKER"] = {
                        headers: ["Mac_Dinh", "Khong_Man", "Co_Man"],
                        data: [stickerRowObj]
                    };
                }
            } catch (err) {
                console.error("Lỗi tải bảng giá phụ:", err);
            }
        }
        
        // Hàm tính toán giá động khi chọn radio button
        function calculatePopupDynamicPrice() {
            if(!popupActiveItem || !popupActiveItem.boCauHinh) return;
            const matrix = dynamicSheetsPhuMatrix[popupActiveItem.boCauHinh]; 
            let priceVal = popupActiveItem.basePrice;

            if (!matrix || !matrix.data || matrix.data.length === 0) return;

            if(popupActiveItem.boCauHinh === 'GIA_THIEP') {
                let selectedThiep = document.querySelector(`input[name="Loai_Thiep"]:checked`)?.value;
                let selectedKieuIn = document.querySelector(`input[name="Kieu_In"]:checked`)?.value;
                let selectedGiay = document.querySelector(`input[name="Loai_Giay"]:checked`)?.value;

                let matched = matrix.data.find(d => d.Loai_Thiep === selectedThiep && d.Kieu_In === selectedKieuIn);
                
                if (!matched || !matched[selectedGiay] || matched[selectedGiay] === "Chưa có" || Number(matched[selectedGiay]) === 0) {
                    priceVal = "Chưa có";
                } else {
                    priceVal = matched[selectedGiay];
                }
            } else {
                let row = matrix.data[0], mat = document.querySelector(`input[name="Card_Mat"]:checked`)?.value, man = document.querySelector(`input[name="Card_Man"]:checked`)?.value, sOpt = document.querySelector(`input[name="Single_Option"]:checked`)?.value;
                if(mat && man) { 
                    let key = `${mat}_${man}`; 
                    if(row[key] !== undefined) priceVal = row[key]; 
                } else if(sOpt && row[sOpt] !== undefined) {
                    priceVal = row[sOpt];
                }
            }

            const priceEl = document.getElementById('popupDynamicPrice');
            if(priceEl) {
                if (priceVal === "Chưa có" || String(priceVal).trim() === "Chưa có") {
                    priceEl.innerText = "Chưa có";
                } else {
                    priceEl.innerText = Number(priceVal).toLocaleString('vi-VN') + " đ";
                }
            }
        }
    </script>
