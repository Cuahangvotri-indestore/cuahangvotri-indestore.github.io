<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Vô Tri // Creative Handmade</title>
    <style>
        :root { 
            --mint-light: #f2faf7;
            --mint-bg: #e6f6f3; 
            --emerald-dark: #1f4e45; 
            --emerald-soft: #387a6f;
            --emerald-glass: rgba(56, 122, 111, 0.12);
            --text-color: #2c3e50;
            --shopee-color: #ea501f;
            /* Liquid Glass Styles */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 78, 69, 0.08);
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #f7fcfb 0%, var(--mint-bg) 50%, #dbf2ee 100%);
            background-attachment: fixed;
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-size: 17px; /* Phóng to cỡ chữ cơ bản */
        }

        .top-bar {
            background: var(--emerald-dark); color: #ffffff;
            text-align: center; font-size: 14px; letter-spacing: 1px;
            padding: 12px 0; font-weight: 600;
        }
        
        header { 
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(31, 78, 69, 0.03);
        }
        
        .nav-container { 
            max-width: 1300px; margin: 0 auto; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 24px; box-sizing: border-box;
        }
        
        .logo-box { display: flex; align-items: center; }
        .logo-circle { 
            width: 130px; height: 130px; /* Tăng kích thước logo lớn rõ ràng ở zoom 100% */
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(5px);
            border: 2px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(31, 78, 69, 0.06), inset 0 4px 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }
        .logo-circle:hover { transform: scale(1.03); }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .menu-categories { 
            display: flex; justify-content: flex-end; align-items: center;
            gap: 18px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; 
        }
        .menu-item { 
            font-weight: 700; font-size: 15px; cursor: pointer; /* Tăng kích thước chữ menu */
            padding: 12px 28px; border-radius: 40px; /* Bo tròn kiểu giọt nước */
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            color: var(--emerald-dark); text-transform: uppercase; letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(31, 78, 69, 0.03);
        }
        .menu-item.active, .menu-item:hover { 
            background: var(--emerald-soft); color: #ffffff; border-color: var(--emerald-soft);
            box-shadow: 0 8px 20px rgba(56, 122, 111, 0.25);
            transform: translateY(-2px);
        }

        .vision-container {
            max-width: 1300px; width: 100%; margin: 30px auto 0; padding: 0 24px; box-sizing: border-box;
            display: none; text-align: center;
        }
        .vision-box {
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(10px);
            padding: 18px 30px; border-radius: 24px;
            color: #34495e; font-size: 16.5px; font-style: italic;
            max-width: 900px; margin: 0 auto;
            border: 1px dashed rgba(56, 122, 111, 0.3);
        }

        /* BANNER LIQUID GLASS */
        .hero-banner { 
            max-width: 1300px; width: 100%; margin: 30px auto 0; padding: 0 24px; box-sizing: border-box;
        }
        .banner-wrapper {
            position: relative; width: 100%; 
            border-radius: 40px; /* Tăng bo góc hiệu ứng lỏng mượt mà */
            overflow: hidden;
            border: 6px solid var(--glass-border); 
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(31, 78, 69, 0.09), inset 0 10px 20px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.2);
            aspect-ratio: 1024 / 285; 
            backdrop-filter: blur(5px);
        }
        
        .banner-slider-track {
            display: flex; width: 100%; height: 100%;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .banner-slide {
            flex: 0 0 100%; width: 100%; height: 100%;
            opacity: 0.3; transition: opacity 1.2s ease;
        }
        .banner-slide.active { opacity: 1; }
        .banner-slide img { 
            width: 100%; height: 100%; 
            object-fit: cover; object-position: center center; display: block; 
        }

        /* BỘ LỌC CĂN PHẢI TUYỆT ĐỐI */
        .filter-section {
            max-width: 1300px; margin: 35px auto 0; padding: 0 24px; box-sizing: border-box;
            display: flex;
            justify-content: flex-end; /* Căn lề phải chuẩn xác */
            width: 100%;
        }
        .sort-box select {
            padding: 13px 28px; border-radius: 40px; 
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6); 
            color: var(--emerald-dark); 
            font-weight: 700; font-size: 14px; outline: none;
            cursor: pointer; 
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(31, 78, 69, 0.05);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .sort-box select:hover {
            background: var(--emerald-soft);
            color: #ffffff;
            border-color: var(--emerald-soft);
        }

        /* CONTENT & CARD PHÓNG TO */
        .main-content { max-width: 1300px; width: 100%; margin: 25px auto 70px; padding: 0 24px; box-sizing: border-box; flex: 1; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 35px; } /* Phóng to card */
        
        /* Card dạng Liquid Glass */
        .product-card { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 32px; 
            border: 1px solid var(--glass-border);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
            display: flex; flex-direction: column; position: relative;
            overflow: hidden; 
            box-shadow: 0 8px 32px 0 rgba(31, 78, 69, 0.04);
            min-height: 440px; /* Tăng chiều cao tổng thể */
        }
        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px rgba(31, 78, 69, 0.09); 
            border-color: rgba(56, 122, 111, 0.4);
        }
        .product-img-wrapper { width: 100%; height: 285px; background: rgba(255, 255, 255, 0.2); overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .product-info { padding: 22px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; }
        .product-title { font-size: 17px; margin: 0 0 12px 0; font-weight: 700; color: var(--emerald-dark); line-height: 1.5; min-height: 50px; display: flex; align-items: center; justify-content: center; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--emerald-soft); background: var(--emerald-glass); padding: 8px 20px; border-radius: 25px; display: inline-block; margin-top: auto; border: 1px solid rgba(56, 122, 111, 0.15); }

        .badge-status { 
            position: absolute; top: 15px; left: 15px; color: var(--emerald-dark); 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(5px);
            padding: 5px 15px; font-size: 12px; font-weight: 700; border-radius: 35px; z-index: 2; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--glass-border);
        }

        footer {
            background: rgba(255, 255, 255, 0.4); border-top: 1px solid var(--glass-border); padding: 40px 24px;
            text-align: center; margin-top: auto; backdrop-filter: blur(15px);
        }
        .footer-content { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .footer-links { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
        .footer-btn {
            text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 28px; border-radius: 40px;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
        }
        .btn-fb { background: rgba(234, 242, 249, 0.6); color: #1877f2; }
        .btn-zl { background: rgba(237, 245, 247, 0.6); color: #0068ff; }
        .btn-sp { background: rgba(255, 242, 238, 0.6); color: var(--shopee-color); }
        .footer-btn:hover { transform: translateY(-2px); opacity: 0.9; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .footer-copy { font-size: 13px; color: #8e9cae; margin: 0; font-weight: 500; }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; justify-content: center; }
            .menu-categories { justify-content: center; gap: 8px; }
            .filter-section { justify-content: center; }
            .banner-wrapper { aspect-ratio: auto; height: 160px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">🌸 CỬA HÀNG VÔ TRI // CREATIVE HANDMADE & PRINTING 🌸</div>

    <header>
        <div class="nav-container">
            <div class="logo-box">
                <div class="logo-circle" id="shop-logo-box"></div>
            </div>
            <nav>
                <ul class="menu-categories">
                    <li class="menu-item active">Home</li>
                    <li class="menu-item">Đồ len</li>
                    <li class="menu-item">In ấn</li>
                    <li class="menu-item">Giấy</li>
                    <li class="menu-item">In 3D</li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="vision-container" id="vision-area">
        <div class="vision-box" id="vision-text-box"></div>
    </div>

    <div class="hero-banner" id="banner-root-area" style="display: none;">
        <div class="banner-wrapper">
            <div class="banner-slider-track" id="carousel-slider-track"></div>
        </div>
    </div>

    <!-- Cấu trúc filter được làm sạch hoàn toàn để ép sang phải -->
    <div class="filter-section">
        <div class="sort-box">
            <select id="sort-selector" onchange="renderProductsGrid()">
                <option value="default">SẮP XẾP: MỚI NHẤT</option>
                <option value="price-asc">GIÁ: THẤP ĐẾN CAO</option>
                <option value="price-desc">GIÁ: CAO ĐẾN THẤP</option>
            </select>
        </div>
    </div>

    <div class="main-content">
        <div class="product-grid" id="product-list-view"></div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-links" id="footer-social-links"></div>
            <p class="footer-copy">© 2026 CỬA HÀNG VÔ TRI. POWERED BY IN.</p>
        </div>
    </footer>

    <script>
        const SPREADSHEET_ID = '1PPmMOIynpRpP7ygb7OpS6GWuIuu8WslWOQgu_gfwHe0'; 
        let globalStoreData = { products: [], config: {} };
        let currentSlideIndex = 0;
        let slideInterval;
        let totalSlidesCount = 0;

        function parseDirectImageUrl(rawUrl) {
            if (!rawUrl) return '';
            const linkStr = String(rawUrl).trim();
            
            if (linkStr.startsWith('images/')) {
                const base = window.location.origin + window.location.pathname;
                if (base.endsWith('index.html')) {
                    return base.replace('index.html', '') + linkStr;
                }
                return base.endsWith('/') ? base + linkStr : base + '/' + linkStr;
            }
            
            if (linkStr.includes('drive.google.com')) {
                let fileId = '';
                const dMatch = linkStr.match(/\/d\/([^/]+)/);
                const idMatch = linkStr.match(/id=([^&]+)/);
                if (dMatch && dMatch[1]) fileId = dMatch[1];
                else if (idMatch && idMatch[1]) fileId = idMatch[1];
                if (fileId) return `https://docs.google.com/uc?export=view&id=${fileId}`;
            }
            return linkStr;
        }

        async function fetchSheetRows(sheetName) {
            try {
                const response = await fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${sheetName}`);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                return json.table.rows;
            } catch (e) { 
                console.error(e); 
                return []; 
            }
        }

        async function initSprint1HomePage() {
            const configRows = await fetchSheetRows('Cau_Hinh_Shop');
            configRows.forEach(row => {
                if(row && row.c && row.c[0] && row.c[1]) {
                    globalStoreData.config[row.c[0].v] = row.c[1].v;
                }
            });

            if(globalStoreData.config['Logo_Shop']) {
                const logoUrl = parseDirectImageUrl(globalStoreData.config['Logo_Shop']);
                document.getElementById('shop-logo-box').innerHTML = `<img src="${logoUrl}" alt="Logo Shop">`;
            }

            if(globalStoreData.config['Tam_Nhin'] && String(globalStoreData.config['Tam_Nhin']).trim() !== "") {
                document.getElementById('vision-text-box').innerText = `"${globalStoreData.config['Tam_Nhin']}"`;
                document.getElementById('vision-area').style.display = 'block';
            }

            setupBannerCarousel();

            renderFooterSocials();

            const productRows = await fetchSheetRows('Danh_Sach_SanPham');
            productRows.forEach((row, idx) => {
                if(row && row.c && row.c[1]) {
                    const pCode = row.c[0] ? String(row.c[0].v).trim() : ''; 
                    const pName = row.c[1] ? String(row.c[1].v).trim() : ''; 
                    const pCat  = row.c[2] ? String(row.c[2].v).trim() : 'KHÁC'; 
                    const pImg  = row.c[3] ? String(row.c[3].v).trim() : ''; 
                    const pStock = row.c[9] ? String(row.c[9].v).trim() : 'Có sẵn'; 
                    const pVis  = row.c[10] ? String(row.c[10].v).trim() : 'Hiện'; 
                    
                    let pPrice = 0;
                    if(row.c[7] && row.c[7].v) {
                        pPrice = parseFloat(String(row.c[7].v).replace(/[^0-9.-]+/g, "")) || 0;
                    }

                    if(pName && pVis.toLowerCase() === 'hiện') {
                        globalStoreData.products.push({
                            sheetIndex: idx, 
                            code: pCode, 
                            name: pName, 
                            category: pCat,
                            img: parseDirectImageUrl(pImg),
                            basePrice: pPrice,
                            stock: pStock
                        });
                    }
                }
            });

            renderProductsGrid();
        }

        function setupBannerCarousel() {
            const track = document.getElementById('carousel-slider-track');
            let bannerUrls = [];
            
            if(globalStoreData.config['Banner_1']) bannerUrls.push(parseDirectImageUrl(globalStoreData.config['Banner_1']));
            if(globalStoreData.config['Banner_2']) bannerUrls.push(parseDirectImageUrl(globalStoreData.config['Banner_2']));
            if(globalStoreData.config['Banner_3']) bannerUrls.push(parseDirectImageUrl(globalStoreData.config['Banner_3']));

            totalSlidesCount = bannerUrls.length;

            if(totalSlidesCount > 0) {
                let htmlSlides = bannerUrls.map((url, index) => {
                    return `<div class="banner-slide ${index === 0 ? 'active' : ''}"><img src="${url}" alt="Banner ${index + 1}"></div>`;
                }).join('');
                
                track.innerHTML = htmlSlides;
                document.getElementById('banner-root-area').style.display = 'block';
                
                if(totalSlidesCount > 1) {
                    clearInterval(slideInterval);
                    slideInterval = setInterval(moveToNextSlide, 8000);
                }
            }
        }

        function moveToNextSlide() {
            const track = document.getElementById('carousel-slider-track');
            const slides = document.querySelectorAll('.banner-slide');
            if(slides.length === 0) return;
            
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = (currentSlideIndex + 1) % totalSlidesCount;
            slides[currentSlideIndex].classList.add('active');
            
            track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
        }

        function renderFooterSocials() {
            const container = document.getElementById('footer-social-links');
            let htmlLinks = '';
            if(globalStoreData.config['Link_FB']) htmlLinks += `<a href="${globalStoreData.config['Link_FB']}" target="_blank" class="footer-btn btn-fb">Facebook</a>`;
            if(globalStoreData.config['Link_Zalo']) htmlLinks += `<a href="${globalStoreData.config['Link_Zalo']}" target="_blank" class="footer-btn btn-zl">Zalo Shop</a>`;
            if(globalStoreData.config['Link_Shopee_Chung']) htmlLinks += `<a href="${globalStoreData.config['Link_Shopee_Chung']}" target="_blank" class="footer-btn btn-sp">Shopee</a>`;
            container.innerHTML = htmlLinks;
        }

        function renderProductsGrid() {
            const container = document.getElementById('product-list-view');
            const sortVal = document.getElementById('sort-selector').value;

            let displayList = [...globalStoreData.products];

            if (sortVal === 'default') {
                displayList.sort((a, b) => b.sheetIndex - a.sheetIndex);
            } else if (sortVal === 'price-asc') {
                displayList.sort((a, b) => a.basePrice - b.basePrice);
            } else if (sortVal === 'price-desc') {
                displayList.sort((a, b) => b.basePrice - a.basePrice);
            }

            if(displayList.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px 0; font-weight: bold; color: var(--emerald-soft);">Không tìm thấy sản phẩm nào để hiển thị.</div>`;
                return;
            }

            container.innerHTML = displayList.map(p => {
                return `
                    <div class="product-card">
                        <span class="badge-status">${p.stock}</span>
                        <div class="product-img-wrapper">
                            <img class="product-img" src="${p.img || 'https://via.placeholder.com/400?text=No+Image'}" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">
                                ${Number(p.basePrice).toLocaleString('vi-VN') + ' đ'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = initSprint1HomePage;
    </script>
</body>
</html>
